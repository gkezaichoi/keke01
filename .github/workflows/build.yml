name: Build Tweak
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -o BonfireCheat_src.zip
          if [ -d "cheat_bonfire2" ]; then
            cp -r cheat_bonfire2/* .
          fi

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Fix Makefile and Build
        run: |
          sed -i 's/^TARGET =.*/TARGET = iphone:clang:latest:14.0/' Makefile
          make FINALPACKAGE=1
          mkdir -p output
          find .theos/obj -name "*.dylib" -exec cp {} output/ \;

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: BonfireCheat-dylib
          path: output/

